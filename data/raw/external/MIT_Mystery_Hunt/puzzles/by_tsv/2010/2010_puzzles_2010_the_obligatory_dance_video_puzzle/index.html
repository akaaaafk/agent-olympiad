<!-- FlowPlayer scripting --> 
<script> 
$(function () {
 
$f("a.player", "../../../support/flowplayer-3.1.5.swf", {
  onBeforeClick: function() {
    $f().unload();

    var wrap = $(this.getParent());
    wrap.find("img").fadeOut();
    wrap.animate({width:320, height:240},500,function() {
      $f(this).load();
    });

    return false;
 },
 
 onUnload: function() {
  $(this.getParent()).animate({width:320, height:75},500, function() {
    $(this).find("img").fadeIn();
  });
 },
 
 onFinish: function() {
   this.unload();
 }
});
});
</script>
